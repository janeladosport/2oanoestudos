<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Janela do Sport — Painel</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#18202a}header{background:#111827;color:#fff;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:15px}header h1{margin:0;font-size:25px}header p{margin:5px 0 0;color:#cbd5e1;font-size:14px}.container{max-width:1100px;margin:28px auto;padding:0 18px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.small{padding:7px 10px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 5px 18px #00000012;border:1px solid #e5e7eb}.folder{cursor:pointer;transition:.15s}.folder:hover{transform:translateY(-2px);box-shadow:0 8px 24px #00000018}.folder-icon{font-size:38px}.card h2{margin:10px 0 6px;font-size:20px}.muted{color:#6b7280;font-size:14px}.back{margin-bottom:18px}.links{display:flex;flex-direction:column;gap:10px;margin-top:15px}.linkbtn{display:flex;justify-content:space-between;align-items:center;background:#f8fafc;border:1px solid #e5e7eb;padding:13px 15px;border-radius:12px;color:#111827;text-decoration:none}.linkbtn:hover{background:#eef2ff}.admin-section{margin-top:30px}.admin-section h2{font-size:19px}.admin-folder{background:#fff;border:1px solid #e5e7eb;border-radius:15px;margin-bottom:12px;overflow:hidden}.admin-folder-head{padding:15px 17px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fafafa}.admin-buttons{padding:10px 17px 16px}.admin-button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.admin-button:last-child{border-bottom:0}.modal-bg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{background:#fff;width:min(500px,100%);border-radius:18px;padding:22px}.modal h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;font:inherit}.status{font-size:13px;color:#6b7280;margin-top:12px;min-height:18px}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:16px;padding:25px;text-align:center;color:#64748b}.hidden{display:none!important}.notice{padding:12px 15px;border-radius:10px;background:#fff7ed;color:#9a3412;margin-bottom:18px;font-size:14px}@media(max-width:600px){header{padding:18px}.container{margin-top:18px}.admin-folder-head{align-items:flex-start;flex-direction:column}}</style></head>
<body><header><div><h1>Janela do Sport</h1><p>Painel de materiais</p></div><div class="row"><button id="loginBtn" class="secondary small">Entrar como administrador</button><button id="logoutBtn" class="secondary small hidden">Sair</button></div></header>
<main class="container"><div id="notice" class="notice hidden"></div><div id="publicView"></div><section id="adminView" class="admin-section hidden"><div class="toolbar"><h2>Administração</h2><div class="row"><button class="primary small" onclick="abrirPastaModal()">+ Nova pasta</button><button class="secondary small" onclick="abrirBotaoModal()">+ Novo botão</button></div></div><div id="adminList"></div></section></main><div id="modalBg" class="modal-bg"><div class="modal" id="modal"></div></div>
<script>
const SUPABASE_URL="https://yqmdvhssrafeqjioafyt.supabase.co",SUPABASE_KEY="sb_publishable_aLJl34fwpBjeXVyvmn1F9w_BPajJrm2",db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let pastas=[],botoes=[],admin=false,pastaAtual=null;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function safeUrl(x){try{let u=new URL(x);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch(e){return '#'}}function showError(e){console.error(e);$('notice').textContent='Erro: '+(e.message||'não foi possível carregar os dados.');$('notice').classList.remove('hidden')}function closeModal(){$('modalBg').style.display='none';$('modal').innerHTML=''}$('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};
async function carregar(){try{$('notice').classList.add('hidden');let p=await db.from('pastas').select('*').order('ordem').order('criado_em');if(p.error)throw p.error;let b=await db.from('botoes').select('*').order('ordem').order('criado_em');if(b.error)throw b.error;pastas=p.data||[];botoes=b.data||[];renderPublic();if(admin)renderAdmin()}catch(e){showError(e)}}async function verificarAdmin(){let {data:{session}}=await db.auth.getSession();admin=false;if(session?.user){let r=await db.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(!r.error&&r.data)admin=true}$('loginBtn').classList.toggle('hidden',admin);$('logoutBtn').classList.toggle('hidden',!admin);$('adminView').classList.toggle('hidden',!admin);if(admin)renderAdmin()}
function renderPublic(){let root=$('publicView');if(pastaAtual){let p=pastas.find(x=>x.id===pastaAtual);if(!p){pastaAtual=null;return renderPublic()}let items=botoes.filter(b=>b.pasta_id===p.id);root.innerHTML='<div class="back"><button class="secondary small" onclick="voltarPastas()">← Voltar</button></div><div class="toolbar"><div><h2 style="margin:0">📁 '+esc(p.titulo)+'</h2><div class="muted">'+items.length+' material(is)</div></div></div>'+(items.length?'<div class="links">'+items.map(b=>'<a class="linkbtn" href="'+esc(safeUrl(b.link))+'" target="_blank" rel="noopener"><span>📄 '+esc(b.titulo)+'</span><span>↗</span></a>').join('')+'</div>':'<div class="empty">Esta pasta ainda não possui botões.</div>');return}root.innerHTML='<div class="toolbar"><div><h2 style="margin:0">Pastas</h2><div class="muted">Selecione uma pasta para acessar os materiais.</div></div></div>'+(pastas.length?'<div class="grid">'+pastas.map(p=>{let n=botoes.filter(b=>b.pasta_id===p.id).length;return '<div class="card folder" onclick="abrirPasta(\''+p.id+'\')"><div class="folder-icon">📁</div><h2>'+esc(p.titulo)+'</h2><div class="muted">'+n+' material(is)</div></div>'}).join('')+'</div>':'<div class="empty">Nenhuma pasta criada ainda.</div>')}function abrirPasta(id){pastaAtual=id;renderPublic();scrollTo({top:0,behavior:'smooth'})}function voltarPastas(){pastaAtual=null;renderPublic()}
function renderAdmin(){let root=$('adminList'),html='';if(!pastas.length)html='<div class="empty">Crie sua primeira pasta.</div>';pastas.forEach(p=>{let items=botoes.filter(b=>b.pasta_id===p.id);html+='<div class="admin-folder"><div class="admin-folder-head"><div><strong>📁 '+esc(p.titulo)+'</strong><div class="muted">'+items.length+' botão(ões)</div></div><div class="row"><button class="secondary small" onclick="abrirPastaModal(\''+p.id+'\')">Editar</button><button class="danger small" onclick="excluirPasta(\''+p.id+'\')">Excluir</button><button class="primary small" onclick="abrirBotaoModal(null,\''+p.id+'\')">+ Botão</button><button class="secondary small" onclick="moverSemPasta(\''+p.id+'\')">Adicionar sem pasta</button></div></div><div class="admin-buttons">'+(items.length?items.map(b=>'<div class="admin-button"><span>📄 '+esc(b.titulo)+'</span><span class="row"><button class="secondary small" onclick="abrirBotaoModal(\''+b.id+'\')">Editar</button><button class="danger small" onclick="excluirBotao(\''+b.id+'\')">Excluir</button></span></div>').join(''):'<div class="muted">Nenhum botão nesta pasta.</div>')+'</div></div>'});let sem=botoes.filter(b=>!b.pasta_id);if(sem.length)html+='<div class="admin-folder"><div class="admin-folder-head"><div><strong>📦 Sem pasta</strong><div class="muted">'+sem.length+' botão(ões)</div></div></div><div class="admin-buttons">'+sem.map(b=>'<div class="admin-button"><span>📄 '+esc(b.titulo)+'</span><span class="row"><button class="secondary small" onclick="abrirBotaoModal(\''+b.id+'\')">Editar / colocar em pasta</button><button class="danger small" onclick="excluirBotao(\''+b.id+'\')">Excluir</button></span></div>').join('')+'</div></div>';root.innerHTML=html}
function abrirPastaModal(id=null){let p=id?pastas.find(x=>x.id===id):null;$('modal').innerHTML='<h2>'+(p?'Editar pasta':'Nova pasta')+'</h2><div class="field"><label>Nome da pasta</label><input id="pastaTitulo" value="'+esc(p?.titulo||'')+'" placeholder="Ex.: Zoologia"></div><div class="row"><button class="primary" onclick="salvarPasta(\''+(id||'')+'\')">Salvar</button><button class="secondary" onclick="closeModal()">Cancelar</button></div>';$('modalBg').style.display='flex'}async function salvarPasta(id){let titulo=$('pastaTitulo').value.trim();if(!titulo)return alert('Digite o nome da pasta.');let r=id?await db.from('pastas').update({titulo}).eq('id',id):await db.from('pastas').insert({titulo,ordem:pastas.length});if(r.error)return alert(r.error.message);closeModal();carregar()}async function excluirPasta(id){let p=pastas.find(x=>x.id===id);if(!confirm('Excluir a pasta "'+p?.titulo+'"? Os botões dentro dela também serão excluídos por ON DELETE CASCADE.'))return;let r=await db.from('pastas').delete().eq('id',id);if(r.error)return alert(r.error.message);if(pastaAtual===id)pastaAtual=null;carregar()}async function moverSemPasta(id){let sem=botoes.filter(b=>!b.pasta_id);if(!sem.length)return alert('Não há botões sem pasta.');if(!confirm('Colocar '+sem.length+' botão(ões) sem pasta dentro desta pasta?'))return;for(const b of sem){let r=await db.from('botoes').update({pasta_id:id}).eq('id',b.id);if(r.error)return alert(r.error.message)}carregar()}
function abrirBotaoModal(id=null,pastaPadrao=''){let b=id?botoes.find(x=>x.id===id):null;$('modal').innerHTML='<h2>'+(b?'Editar botão':'Novo botão')+'</h2><div class="field"><label>Título</label><input id="botaoTitulo" value="'+esc(b?.titulo||'')+'" placeholder="Ex.: Aula de Zoologia"></div><div class="field"><label>Link</label><input id="botaoLink" value="'+esc(b?.link||'')+'" placeholder="https://..."></div><div class="field"><label>Pasta</label><select id="botaoPasta"><option value="">Sem pasta</option>'+pastas.map(p=>'<option value="'+p.id+'" '+((b?.pasta_id||pastaPadrao)===p.id?'selected':'')+'>📁 '+esc(p.titulo)+'</option>').join('')+'</select></div><div class="row"><button class="primary" onclick="salvarBotao(\''+(id||'')+'\')">Salvar</button><button class="secondary" onclick="closeModal()">Cancelar</button></div>';$('modalBg').style.display='flex'}async function salvarBotao(id){let titulo=$('botaoTitulo').value.trim(),link=$('botaoLink').value.trim(),pasta_id=$('botaoPasta').value||null;if(!titulo||!link)return alert('Preencha título e link.');if(safeUrl(link)==='#')return alert('Use um link começando com http:// ou https://');let r=id?await db.from('botoes').update({titulo,link,pasta_id}).eq('id',id):await db.from('botoes').insert({titulo,link,pasta_id,ordem:botoes.length});if(r.error)return alert(r.error.message);closeModal();carregar()}async function excluirBotao(id){let b=botoes.find(x=>x.id===id);if(!confirm('Excluir o botão "'+b?.titulo+'"?'))return;let r=await db.from('botoes').delete().eq('id',id);if(r.error)return alert(r.error.message);carregar()}
$('loginBtn').onclick=()=>{$('modal').innerHTML='<h2>Login de administrador</h2><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Senha</label><input id="senha" type="password"></div><div class="row"><button class="primary" onclick="login()">Entrar</button><button class="secondary" onclick="closeModal()">Cancelar</button></div><div id="loginStatus" class="status"></div>';$('modalBg').style.display='flex'};async function login(){let r=await db.auth.signInWithPassword({email:$('email').value,password:$('senha').value});if(r.error){$('loginStatus').textContent=r.error.message;return}closeModal();await verificarAdmin();carregar()}$('logoutBtn').onclick=async()=>{await db.auth.signOut();admin=false;pastaAtual=null;await verificarAdmin();carregar()};db.auth.onAuthStateChange(()=>setTimeout(verificarAdmin,0));(async()=>{await verificarAdmin();await carregar()})();
</script></body></html>
